<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>广东省食品从业人员健康证明</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #7a6b58;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }
        .card {
            position: relative;
            max-width: 780px;
            width: 100%;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
            overflow: hidden;
            border: 1px solid #b3a087;
        }
        .card-bg {
            display: block;
            width: 100%;
            height: auto;
            pointer-events: none;
            user-select: none;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
        }
        .overlay-text {
            position: absolute;
            pointer-events: auto;
            font-weight: 600;
            color: #1a150f;
            white-space: nowrap;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        /* ———— 以下为各字段定位（百分比，适配任意宽度） ———— */
        .t-name {
            top: 25.2%;
            left: 32.0%;
            font-size: 1.9vw;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .t-gender {
            top: 25.2%;
            left: 68.0%;
            font-size: 1.8vw;
            font-weight: 600;
        }
        .t-id {
            top: 32.4%;
            left: 33.0%;
            font-size: 1.8vw;
            font-weight: 600;
            letter-spacing: 0.6px;
            font-family: "Courier New", monospace;
        }
        .t-idnote {
            top: 32.4%;
            left: 79.0%;
            font-size: 1.0vw;
            font-weight: 400;
            color: #3d3428;
        }
        .t-hospital {
            top: 39.2%;
            left: 25.5%;
            font-size: 1.7vw;
            font-weight: 600;
        }
        .t-seal1 {
            top: 39.6%;
            left: 76.0%;
            font-size: 1.5vw;
            font-weight: 700;
            color: #1f1a14;
            background: rgba(210, 198, 180, 0.45);
            padding: 0.1vw 1.2vw;
            border-radius: 40px;
            border: 1px solid rgba(160, 140, 118, 0.5);
            backdrop-filter: blur(1px);
            letter-spacing: 1px;
        }
        .t-date-label {
            top: 45.4%;
            left: 19.8%;
            font-size: 1.6vw;
            font-weight: 500;
        }
        .t-date-value {
            top: 45.4%;
            left: 42.5%;
            font-size: 1.7vw;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .t-valid-label {
            top: 45.4%;
            left: 67.5%;
            font-size: 1.6vw;
            font-weight: 500;
        }
        .t-valid-badge {
            top: 45.4%;
            left: 84.5%;
            font-size: 1.4vw;
            font-weight: 700;
            color: #1f1a14;
            background: rgba(210, 198, 180, 0.5);
            padding: 0.1vw 1.2vw;
            border-radius: 40px;
            border: 1px solid rgba(160, 140, 118, 0.5);
            backdrop-filter: blur(1px);
            letter-spacing: 0.5px;
        }
        .t-stamp1 {
            top: 54.0%;
            left: 42.5%;
            font-size: 1.8vw;
            font-weight: 800;
            color: #fcf3e3;
            background: #b13f2e;
            padding: 0.3vw 2.2vw;
            border-radius: 60px;
            border: 3px solid #742e20;
            box-shadow: 0 0 0 2px #dacfc0, inset 0 0 0 2px #f0e6d8;
            letter-spacing: 4px;
            transform: rotate(0.2deg);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }
        .t-stamp2 {
            top: 54.0%;
            left: 76.0%;
            font-size: 1.8vw;
            font-weight: 800;
            color: #1a150e;
            background: #dacebc;
            padding: 0.3vw 2.2vw;
            border-radius: 60px;
            border: 3px solid #a18769;
            box-shadow: 0 0 0 2px #f0e8dc, inset 0 0 0 2px #f3ede3;
            letter-spacing: 6px;
            transform: rotate(0.2deg);
            background-image: radial-gradient(circle at 30% 40%, #e8ddcc 2px, transparent 2px);
            background-size: 14px 14px;
        }
        .t-extra-seal {
            top: 61.6%;
            left: 46.0%;
            font-size: 1.4vw;
            font-weight: 700;
            color: #f7efe2;
            background: #b13f2e;
            padding: 0.2vw 1.8vw;
            border-radius: 60px;
            border: 2px solid #7f2e20;
            box-shadow: 0 0 0 2px #e6dac8;
            letter-spacing: 2px;
            transform: rotate(-0.2deg);
        }
        .t-extra-hospital {
            top: 61.6%;
            left: 77.0%;
            font-size: 1.0vw;
            font-weight: 600;
            color: #f2efe6;
            background: #3f5c4b;
            padding: 0.2vw 1.6vw;
            border-radius: 40px;
            border: 1px solid #2d4235;
            letter-spacing: 0.5px;
        }
        .t-meta {
            position: absolute;
            bottom: 3.0%;
            right: 4.0%;
            font-size: 0.8vw;
            color: #a3947c;
            opacity: 0.5;
            letter-spacing: 1px;
            display: flex;
            gap: 2.0vw;
            pointer-events: auto;
            font-weight: 400;
        }

        @media (max-width: 780px) {
            .t-name {
                font-size: 2.4vw;
            }
            .t-gender {
                font-size: 2.2vw;
            }
            .t-id {
                font-size: 2.2vw;
            }
            .t-idnote {
                font-size: 1.4vw;
            }
            .t-hospital {
                font-size: 2.2vw;
            }
            .t-seal1 {
                font-size: 2.0vw;
            }
            .t-date-label {
                font-size: 2.2vw;
            }
            .t-date-value {
                font-size: 2.2vw;
            }
            .t-valid-label {
                font-size: 2.2vw;
            }
            .t-valid-badge {
                font-size: 2.0vw;
            }
            .t-stamp1 {
                font-size: 2.6vw;
            }
            .t-stamp2 {
                font-size: 2.6vw;
            }
            .t-extra-seal {
                font-size: 2.0vw;
            }
            .t-extra-hospital {
                font-size: 1.6vw;
            }
            .t-meta {
                font-size: 1.2vw;
            }
        }
        @media (max-width: 480px) {
            .t-name {
                font-size: 3.6vw;
            }
            .t-gender {
                font-size: 3.4vw;
            }
            .t-id {
                font-size: 3.4vw;
            }
            .t-idnote {
                font-size: 2.2vw;
            }
            .t-hospital {
                font-size: 3.4vw;
            }
            .t-seal1 {
                font-size: 3.0vw;
                padding: 0.2vw 1.8vw;
            }
            .t-date-label {
                font-size: 3.2vw;
            }
            .t-date-value {
                font-size: 3.4vw;
            }
            .t-valid-label {
                font-size: 3.2vw;
            }
            .t-valid-badge {
                font-size: 3.0vw;
            }
            .t-stamp1 {
                font-size: 4.0vw;
                padding: 0.3vw 3.0vw;
            }
            .t-stamp2 {
                font-size: 4.0vw;
                padding: 0.3vw 3.0vw;
            }
            .t-extra-seal {
                font-size: 3.0vw;
            }
            .t-extra-hospital {
                font-size: 2.6vw;
            }
            .t-meta {
                font-size: 1.8vw;
                gap: 3vw;
            }
        }
    </style>
</head>
